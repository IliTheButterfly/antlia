name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    # The codec and the NDEF parser are standard-library-only C, so the tests
    # that matter most run without a Flipper, an SDK, or a cross-compiler.
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make test

  vectors-match-idcodec:
    # tests/vectors.h is generated from Almagest's Python implementations.
    # Regenerating it here and diffing is what catches the C port drifting away
    # from them — the short-ID codec it must agree with symbol for symbol, and
    # since ADR 0014 the NDEF encoder it must agree with **byte for byte**,
    # because Antlia can now write a tag and a phone has to be able to read it.
    name: Vectors still match idcodec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: IliTheButterfly/almagest
          path: almagest
      - uses: actions/checkout@v4
        with:
          path: antlia
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and diff
        # **No venv, and no `uv`.** The generator imports exactly two modules —
        # `idcodec` (zero dependencies by design, and a test enforces it) and
        # `agent.ndef` (standard library only) — so a PYTHONPATH is the whole
        # setup.
        #
        # Building the deviceagent's environment instead would drag in
        # `almagest-backend`, which is a test-only path dependency of it, which
        # needs Almagest's own submodules checked out. That is a lot of machinery
        # for two pure-Python files, and it fails in a way that has nothing to do
        # with whether the vectors match.
        run: |
          PYTHONPATH=almagest/idcodec:almagest/deviceagent \
            python antlia/tools/gen_vectors.py > /tmp/vectors.h
          diff -u antlia/tests/vectors.h /tmp/vectors.h

  firmware-build:
    name: Build antlia.fap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ufbt
        run: pip install ufbt
      - name: Fetch the Momentum SDK
        # Momentum, not official: a FAP built against a mismatched SDK loads and
        # then dies on a missing symbol.
        run: make sdk
      - name: Build
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: antlia.fap
          path: dist/antlia.fap
